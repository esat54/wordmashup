name: WordMashup Daily Backup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backup Repository
        uses: actions/checkout@v4
        with:
          repository: esat54/wordmashup-backup 
          token: ${{ secrets.BACKUP_TOKEN }}     
          path: backup-repo                    

      - name: Install MongoDB Tools and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg wget jq
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | gpg --dearmor | sudo tee /usr/share/keyrings/mongodb-server-7.0.gpg > /dev/null
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools

      - name: Export and Format Collections
        env:
          MONGO_URI: ${{ secrets.MONGODB_URI }}
        run: |
          mkdir -p backup-repo/backups
          collections=("grammars" "oxforduserprogresses" "oxfordwords" "savedquizwords" "users" "wordquizzes" "words")
          for col in "${collections[@]}"; do
            mongoexport --uri="$MONGO_URI" --collection=$col --out="backup-repo/backups/$col.json" --jsonArray
            cat "backup-repo/backups/$col.json" | jq . > "backup-repo/backups/temp.json" && mv "backup-repo/backups/temp.json" "backup-repo/backups/$col.json"
          done

      - name: Commit and Push to Backup Repo
        working-directory: backup-repo 
        run: |
          git config --global user.name "esat54"
          git config --global user.email "esatsprx77@gmail.com"
          git add backups/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Backup: $(date +'%Y-%m-%d')" && git push)